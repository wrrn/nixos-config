image: alpine/edge
secrets:
  - 91c9830e-fda4-41a7-8b3b-a12993056b86
sources:
  - git+ssh://git@git.sr.ht/~warren/nixos-config
tasks:
  - mirror-to-github: |
      cd ~/nixos-config
      ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts
      git remote add github git@github.com:wrrn/nixos-config
      git push --mirror github
